plugins { id "com.android.application" }

def cfg = rootProject.file("../web/firebase-config.js").text
def valor = { String k -> (cfg =~ /${k}:\s*"([^"]+)"/)[0][1] }
def firma = new Properties()
firma.load(rootProject.file("../firma.properties").newInputStream())

android {
    namespace "co.daniela.agenda.movil"
    compileSdk 34
    defaultConfig {
        applicationId "co.daniela.agenda.movil"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.1"
        buildConfigField "String", "API_KEY", "\"${valor('apiKey')}\""
        buildConfigField "String", "PROJECT_ID", "\"${valor('projectId')}\""
        buildConfigField "String", "AGENDA_URL", "\"https://dani-vergaram.github.io/agenda/\""
    }
    signingConfigs {
        agenda {
            storeFile rootProject.file("../firma.jks")
            storePassword firma.storePassword
            keyAlias firma.keyAlias
            keyPassword firma.storePassword
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.agenda }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
