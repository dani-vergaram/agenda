plugins { id "com.android.application" }

// Toma los datos de Firebase del mismo archivo que usa la app web.
def cfg = rootProject.file("../web/firebase-config.js").text
def valor = { String k -> (cfg =~ /${k}:\s*"([^"]+)"/)[0][1] }
def firma = new Properties()
firma.load(rootProject.file("../firma.properties").newInputStream())

android {
    namespace "co.daniela.agenda"
    compileSdk 34
    defaultConfig {
        applicationId "co.daniela.agenda"
        minSdk 30
        targetSdk 34
        versionCode 8
        versionName "1.5"
        buildConfigField "String", "API_KEY", "\"${valor('apiKey')}\""
        buildConfigField "String", "PROJECT_ID", "\"${valor('projectId')}\""
    }
    signingConfigs {
        agenda {
            storeFile rootProject.file("../firma.jks")
            storePassword firma.storePassword
            keyAlias firma.keyAlias
            keyPassword firma.storePassword
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.agenda }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tarjeta del reloj y dato para la esfera.
    implementation "androidx.wear.tiles:tiles:1.4.0"
    implementation "androidx.wear.protolayout:protolayout:1.2.0"
    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"
    implementation "com.google.guava:guava:33.3.1-android"
}
