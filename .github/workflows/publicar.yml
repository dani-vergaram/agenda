name: Publicar agenda
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    needs: [reloj, celular]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agenda-celular
          path: apk-celular
      - uses: actions/download-artifact@v4
        with:
          name: agenda-reloj
          path: apk-reloj
      - run: |
          cp apk-celular/app-debug.apk web/agenda-celular.apk
          cp apk-reloj/app-debug.apk web/agenda-reloj.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
  reloj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Firma desde los secretos
        env:
          FIRMA_JKS: ${{ secrets.FIRMA_JKS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: |
          if [ -z "$FIRMA_JKS" ]; then echo "Sin secretos: se usa la firma del repositorio"; exit 0; fi
          printf '%s' "$FIRMA_JKS" | tr -d ' \n\r' | base64 -d > firma.nueva
          if [ -f firma.jks ] && ! cmp -s firma.jks firma.nueva; then echo "::error::El secreto FIRMA_JKS no coincide con la firma actual"; exit 1; fi
          mv firma.nueva firma.jks
          printf 'storePassword=%s\nkeyAlias=%s\n' "$FIRMA_CLAVE" "$FIRMA_ALIAS" > firma.properties
          keytool -list -keystore firma.jks -storepass "$FIRMA_CLAVE" -alias "$FIRMA_ALIAS" > /dev/null
          echo "Firma tomada de los secretos"
      - run: gradle -p watch assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-reloj
          path: watch/app/build/outputs/apk/debug/app-debug.apk
  celular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Firma desde los secretos
        env:
          FIRMA_JKS: ${{ secrets.FIRMA_JKS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: |
          if [ -z "$FIRMA_JKS" ]; then echo "Sin secretos: se usa la firma del repositorio"; exit 0; fi
          printf '%s' "$FIRMA_JKS" | tr -d ' \n\r' | base64 -d > firma.nueva
          if [ -f firma.jks ] && ! cmp -s firma.jks firma.nueva; then echo "::error::El secreto FIRMA_JKS no coincide con la firma actual"; exit 1; fi
          mv firma.nueva firma.jks
          printf 'storePassword=%s\nkeyAlias=%s\n' "$FIRMA_CLAVE" "$FIRMA_ALIAS" > firma.properties
          keytool -list -keystore firma.jks -storepass "$FIRMA_CLAVE" -alias "$FIRMA_ALIAS" > /dev/null
          echo "Firma tomada de los secretos"
      - run: gradle -p movil assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-celular
          path: movil/app/build/outputs/apk/debug/app-debug.apk
