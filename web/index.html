<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda de Daniela</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0a6c5a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: página de agenda; la lista del día manda a la izquierda, y el mes y las notas rayadas acompañan a la derecha. */
:root {
  /* Paleta coral y menta. --car, --uaesp, --ev y --accent se pueden cambiar desde "Colores". */
  --bg: #fbf6f3; --paper: #ffffff; --ink: #1e2a2f; --muted: #5f6b6f; --line: #ecdcd5; --rule: #efd3c9;
  --accent: #3e9f93; --on-accent: #1e2a2f; --soft: #e2f5f0; --mark: #b4472f; --mark-soft: #fce1d9; --mix-ev: 45%; --mix-tag: 60%;
  --sem-r: #d1453b; --sem-a: #d99a12; --sem-v: #3f9a5a;
  --car: #9be4d1; --uaesp: #ffb199; --ev: #fce1d9; --pend: #5f7a80;
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1e2a2f; --paper: #26353b; --ink: #f6ece8; --muted: #a7b4b8; --line: #36474e; --rule: #3c4f56;
  --accent: #9be4d1; --on-accent: #1e2a2f; --soft: #2c4844; --mark: #ffb199; --mark-soft: #4a3631; --mix-ev: 14%; --mix-tag: 30%; --sem-r: #ff8a7f; --sem-a: #f2c14e; --sem-v: #7fd39a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1e2a2f; --paper: #26353b; --ink: #f6ece8; --muted: #a7b4b8; --line: #36474e; --rule: #3c4f56;
  --accent: #9be4d1; --on-accent: #1e2a2f; --soft: #2c4844; --mark: #ffb199; --mark-soft: #4a3631; --mix-ev: 14%; --mix-tag: 30%; --sem-r: #ff8a7f; --sem-a: #f2c14e; --sem-v: #7fd39a; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1060px; margin: 0 auto; padding-block: 28px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 28px 44px; align-items: start;
}
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { margin: 0 0 2px; color: var(--muted); font-size: .875rem; font-weight: 500; }
h1 { margin: 0; font: 700 clamp(2rem, 6vw, 3.1rem)/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.festivo { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 99px; background: var(--mark-soft); color: var(--mark); font-size: .8125rem; font-weight: 600; }
.nav { display: flex; gap: 6px; }
.btn { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.icon { width: 40px; padding: 0; font-size: 1.15rem; }

main, aside { display: grid; gap: 18px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; border-bottom: 1px solid var(--line); }
.tab { padding: 8px 0; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-weight: 500; font-variant-numeric: tabular-nums; }

.add { display: flex; flex-wrap: wrap; gap: 8px; }
#nuevoTexto { flex: 1 1 100%; }
.add input, .add select { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); min-width: 0; }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); color: var(--muted); font-size: .875rem; font-weight: 600; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tag { padding: 0 7px; border-radius: 99px; font-size: .6875rem; font-weight: 700; letter-spacing: .04em; line-height: 1.6; }
.tag.car { background: color-mix(in srgb, var(--car) var(--mix-tag), var(--paper)); color: var(--ink); }
.tag.uaesp { background: color-mix(in srgb, var(--uaesp) var(--mix-tag), var(--paper)); color: var(--ink); }
.task.evento { grid-template-columns: 70px minmax(0, 1fr) auto auto; background: color-mix(in srgb, var(--ev) var(--mix-ev), var(--paper)); box-shadow: inset 4px 0 0 var(--ev); }
.hora { margin-top: 4px; font-size: .875rem; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.task.evento[data-estado="tachado"] .hora { color: var(--muted); text-decoration: line-through; }
.fila input[type="time"] { min-height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.colores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.colores label { display: flex; align-items: center; gap: 8px; font-size: .875rem; font-weight: 500; }
.colores input { width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; }
.temas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sem { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px 0 6px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); color: var(--ink); font-size: .75rem; font-weight: 600; line-height: 1.6; }
.sem::before { content: ""; width: 9px; height: 9px; border-radius: 50%; }
.sem.alta::before { background: var(--sem-r); }
.sem.media::before { background: var(--sem-a); }
.sem.baja::before { background: var(--sem-v); }
.sem:hover { border-color: var(--ink); }
.task[data-prioridad="alta"][data-estado="pendiente"] .check { border-color: var(--sem-r); }
.tag.muni { background: var(--paper); border: 1px solid var(--line); color: var(--ink); font-weight: 600; letter-spacing: 0; }
.munis { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 4px; }
.munis .chip { min-height: 30px; padding: 0 11px; font-size: .8125rem; }
#nuevoMunicipio { width: 170px; }
#nuevoTema { width: 200px; }
.fila input[type="text"] { min-height: 34px; width: 150px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.tag.muni.conColor { background: color-mix(in srgb, var(--cat) var(--mix-tag), var(--paper)); border-color: var(--cat); }
.chip.conColor::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--cat); }
.mas-colores { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.mas-colores summary { cursor: pointer; font-weight: 600; font-size: .875rem; color: var(--muted); }
.grupo-color { margin: 14px 0 8px; font: 600 .75rem/1.3 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.mes-head + .grupo-color { margin-top: 4px; }
.mas-colores h3 { margin: 12px 0 6px; font: 600 .75rem/1.3 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.task[data-estado="hecho"] { background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
.task[data-estado="tachado"] { background: color-mix(in srgb, var(--muted) 8%, var(--paper)); }
.fila select { min-height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.add input::placeholder { color: var(--muted); }

.grupo { display: grid; gap: 4px; }
.grupo h2 { margin: 10px 0 2px; font: 600 .8125rem/1.3 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.grupo.atraso h2 { color: var(--mark); }
.grupo.eventos h2 { color: color-mix(in srgb, var(--ev) 30%, var(--ink)); }
ul { list-style: none; margin: 0; padding: 0; }
.lista { overflow: hidden; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.task { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 2px 6px; align-items: start; padding: 9px 8px 9px 12px; }
.task + .task { border-top: 1px solid var(--line); }
.check { width: 26px; height: 26px; margin-top: 3px; padding: 0; border: 2px solid var(--pend); border-radius: 6px; background: transparent; display: grid; place-items: center; }
.check:hover { border-color: var(--accent); }
.check svg { width: 20px; height: 20px; fill: none; stroke: var(--on-accent); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.task[data-estado="hecho"] .check { background: var(--accent); border-color: var(--accent); }
.task[data-estado="hecho"] .check svg { visibility: visible; }
.task.recien .check svg path { stroke-dasharray: 24; animation: trazo .28s ease-out; }
@keyframes trazo { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
.cuerpo { min-width: 0; }
.texto { display: block; width: 100%; min-height: 30px; padding: 3px 2px; border: 0; border-radius: 4px; background: none; resize: none; overflow: hidden; field-sizing: content; line-height: 1.45; }
.task[data-estado="hecho"] .texto { color: var(--muted); }
.task[data-estado="tachado"] .texto { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--mark); text-decoration-thickness: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 10px; padding-left: 2px; color: var(--muted); font-size: .8125rem; }
.meta .tarde { color: var(--mark); font-weight: 600; }
.resumen-nota { margin: 2px 0 0 2px; color: var(--muted); font-size: .875rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.mini { min-height: 34px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: .8125rem; font-weight: 600; }
.mini:hover { background: var(--soft); color: var(--ink); }
.mini.tachar[aria-pressed="true"] { color: var(--mark); background: var(--mark-soft); }
.mini.peligro:hover { color: var(--mark); background: var(--mark-soft); }
.panel { grid-column: 2 / -1; display: grid; gap: 8px; padding: 6px 2px 4px; }
.panel label { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.panel textarea { display: block; width: 100%; min-height: 72px; margin-top: 3px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; font-weight: 400; color: var(--ink); font-size: 1rem; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fila input[type="date"] { min-height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }

.vacio { padding: 26px 18px; text-align: center; color: var(--muted); background: var(--paper); border: 1px dashed var(--rule); border-radius: 10px; }
.vacio strong { display: block; color: var(--ink); font: 600 1.125rem/1.3 var(--display); }
.quitar { justify-self: start; }

.tarjeta { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.mes-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mes-head h2 { margin: 0; font: 600 1.05rem/1.2 var(--display); text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; font-variant-numeric: tabular-nums; }
.cal span { text-align: center; font-size: .75rem; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
.cal-card { container-type: inline-size; }
.dia { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; aspect-ratio: 1; max-width: 100%; min-width: 0; padding: 6px 0 0; border: 0; border-radius: 7px; background: none; font-size: .875rem; overflow: hidden; }
.puntos { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
.puntos i { width: 6px; height: 6px; border-radius: 50%; }
.puntos i.e { width: 6px; height: 6px; background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--c); }
.dia.sel .puntos i { outline: 1px solid var(--paper); }
.evs { display: none; }
@container (min-width: 460px) {
  .dia { aspect-ratio: auto; min-height: 88px; align-items: stretch; padding: 6px 4px; text-align: center; }
  .puntos i.e { display: none; }
  .evs { display: flex; flex-direction: column; gap: 2px; }
  .ev-mini { padding: 1px 5px; border-radius: 4px; background: color-mix(in srgb, var(--cat) var(--mix-tag), var(--paper)); color: var(--ink); font-size: .6875rem; font-weight: 500; line-height: 1.35; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-mini.mas { background: none; color: var(--muted); }
}
.proximas { display: grid; gap: 2px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.proximas h3 { margin: 0 0 4px; font: 600 .75rem/1.3 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.resumen h3 { color: var(--ink); }
.cifras { margin: 0 0 6px; color: var(--muted); font-size: .8125rem; }
.res-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px; font-size: .8125rem; }
.res-item.ev { background: color-mix(in srgb, var(--ev) var(--mix-ev), var(--paper)); }
.res-item b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.res-item .meta { grid-column: 2; padding-left: 0; }
.res-item .pto { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--pend); align-self: center; }
.res-item .pto.alta { background: var(--sem-r); border-color: var(--sem-r); }
.res-item .pto.media { background: var(--sem-a); border-color: var(--sem-a); }
.res-item .pto.baja { background: var(--sem-v); border-color: var(--sem-v); }
.res-item.hecho span { color: var(--muted); text-decoration: line-through; }
.res-nota { margin: 6px 0 0; padding: 6px 8px; border-left: 3px solid var(--rule); color: var(--muted); font-size: .8125rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.prox { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; justify-items: start; padding: 6px 6px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: .8125rem; }
.prox:hover { background: var(--soft); }
.prox b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prox span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prox span { max-width: 100%; }
.prox .meta { padding-left: 0; }
.dia:hover { background: var(--soft); }
.dia.fuera { color: var(--muted); opacity: .55; }
.dia.festivo-d { color: var(--mark); font-weight: 600; }
.dia.hoy { box-shadow: inset 0 0 0 1.5px var(--accent); }
.dia.sel, .dia.sel.festivo-d { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.leyenda { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 8px 0 0; color: var(--muted); font-size: .75rem; }
.leyenda b { font-weight: 600; color: var(--mark); }

.notas h2 { margin: 0 0 6px; font: 600 1.05rem/1.2 var(--display); }
#notaDia {
  display: block; width: 100%; min-height: 252px; padding: 0 2px; border: 0; background-color: transparent; resize: vertical;
  line-height: 28px; background-image: linear-gradient(to bottom, transparent 27px, var(--rule) 27px); background-size: 100% 28px; background-attachment: local;
}
.guardado { margin: 6px 0 0; min-height: 1.2em; color: var(--muted); font-size: .75rem; }
.aviso { grid-column: 1 / -1; margin: 0; padding: 9px 12px; border-radius: 8px; background: var(--mark-soft); color: var(--mark); font-size: .875rem; font-weight: 500; }

#toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: .9375rem;
}
#toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 2px; }

#login { max-width: 380px; margin: 12vh auto 0; display: grid; gap: 12px; padding: 0 16px; }
#login h1 { font-size: 2.2rem; }
#login input { min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
#loginError { margin: 0; color: var(--mark); font-size: .9375rem; }
.salir { justify-self: start; }
@media (max-width: 840px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) {
  .add { grid-template-columns: minmax(0, 1fr) auto; }
  #nuevoTexto { grid-column: 1 / -1; }
  .task { grid-template-columns: 34px minmax(0, 1fr) auto; }
  .task.evento { grid-template-columns: 70px minmax(0, 1fr) auto; }
  .hora { grid-column: 1; grid-row: 1; }
  .mini.mas { grid-column: 3; grid-row: 2; }
  .mini.tachar { grid-column: 3; grid-row: 1; }
  .check { grid-column: 1; grid-row: 1; }
  .cuerpo { grid-column: 2; grid-row: 1 / span 2; }
  .panel { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { .task.recien .check svg path { animation: none; } }
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Agenda de Daniela</h1>
  <input id="correo" type="email" placeholder="Correo" aria-label="Correo" autocomplete="username" required>
  <input id="clave" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
  <button class="btn solid" type="submit">Entrar</button>
  <p id="loginError" hidden></p>
</form>
<div class="wrap" id="app" hidden>
  <p class="aviso" id="aviso" hidden></p>
  <header>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="titulo"></h1>
      <span class="festivo" id="festivo" hidden></span>
    </div>
    <nav class="nav" aria-label="Cambiar de día">
      <button class="btn icon" id="ant" type="button" aria-label="Día anterior">‹</button>
      <button class="btn" id="hoy" type="button">Hoy</button>
      <button class="btn icon" id="sig" type="button" aria-label="Día siguiente">›</button>
    </nav>
  </header>

  <main>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabDia" role="tab" type="button">Este día</button>
      <button class="tab" id="tabTodos" role="tab" type="button">Pendientes</button>
      <button class="tab" id="tabEventos" role="tab" type="button">Reuniones</button>
      <button class="tab" id="tabHechos" role="tab" type="button">Realizadas</button>
    </div>
    <div class="areas" role="group" aria-label="Ver pendientes de">
      <button class="chip" type="button" data-area="">Todo</button>
      <button class="chip" type="button" data-area="CAR">CAR</button>
      <button class="chip" type="button" data-area="UAESP">UAESP</button>
    </div>
    <div class="munis" id="munis" role="group" aria-label="Municipios de la CAR" hidden></div>
    <div class="munis" id="temas" role="group" aria-label="Temas de la UAESP" hidden></div>
    <datalist id="listaMunicipios"></datalist>
    <datalist id="listaTemas"></datalist>
    <form class="add" id="form">
      <input id="nuevoTexto" type="text" placeholder="Escribe un pendiente" aria-label="Nuevo pendiente" autocomplete="off">
      <input id="nuevaFecha" type="date" aria-label="Fecha del pendiente; déjala vacía si no tiene fecha">
      <select id="nuevoTipo" aria-label="Tipo"><option value="tarea">Pendiente</option><option value="evento">Reunión o evento</option></select>
      <input id="nuevaHora" type="time" aria-label="Hora de inicio" hidden>
      <input id="nuevaHoraFin" type="time" aria-label="Hora de fin" hidden>
      <select id="nuevaPrioridad" aria-label="Prioridad"><option value="">Sin prioridad</option><option value="alta">🔴 Urgente</option><option value="media">🟡 Importante</option><option value="baja">🟢 Puede esperar</option></select>
      <input id="nuevoMunicipio" type="text" list="listaMunicipios" placeholder="Municipio" aria-label="Municipio" autocomplete="off">
      <input id="nuevoTema" type="text" list="listaTemas" placeholder="Tema" aria-label="Tema" autocomplete="off" hidden>
      <select id="nuevaArea" aria-label="Entidad del pendiente"><option value="CAR">CAR</option><option value="UAESP">UAESP</option><option value="">Sin entidad</option></select>
      <button class="btn solid" type="submit">Agregar</button>
    </form>
    <div id="contenido" class="grupo"></div>

<script src="firebase-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const aFecha = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const sumar = (s, n) => { const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); };
const hoyIso = () => iso(new Date());
const fmtLargo = new Intl.DateTimeFormat("es-CO", { weekday: "long", day: "numeric", month: "long" });
const fmtCorto = new Intl.DateTimeFormat("es-CO", { weekday: "short", day: "numeric", month: "short" });
const fmtMes = new Intl.DateTimeFormat("es-CO", { month: "long", year: "numeric" });
const mayus = s => s.charAt(0).toUpperCase() + s.slice(1);
const largo = s => mayus(fmtLargo.format(aFecha(s)).replace(",", ""));
const fmtHora = s => { const [H, M] = s.split(":").map(Number); return ((H % 12) || 12) + ":" + pad(M) + (H < 12 ? " a. m." : " p. m."); };
const esEv = t => t.tipo === "evento";
const BASE_MUNIS = ["Bojacá", "Chocontá", "Fusagasugá", "Guaduas", "La Calera", "La Mesa", "Viotá"];
const llano = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const municipios = () => [...new Set([...BASE_MUNIS, ...[...S.items.values()].map(t => t.municipio).filter(Boolean)])].sort((a, b) => a.localeCompare(b, "es"));
const detectarMunicipio = texto => { const t = " " + llano(texto) + " "; return municipios().find(m => t.includes(" " + llano(m) + " ") || t.includes(" " + llano(m) + ",") || t.includes(" " + llano(m) + ".") || t.includes(" " + llano(m) + ":")) || null; };
const BASE_TEMAS = ["Cementerio Central", "Protocolo de acceso", "Oficios y documentos", "Convenios IDIPRON", "RenoBo (Contrato 581)", "Servicios funerarios", "Alumbrado público"];
const CLAVES_TEMA = [["Protocolo de acceso", ["protocolo"]], ["Cementerio Central", ["cementerio central", "elipse", "patrimonio funerario", "encuentro iberoamericano"]],
  ["Convenios IDIPRON", ["idipron"]], ["RenoBo (Contrato 581)", ["renobo", "581"]], ["Oficios y documentos", ["oficio", "radicado", "comunicado", "memorando", "documento"]],
  ["Alumbrado público", ["alumbrado"]], ["Servicios funerarios", ["funerari", "cementerio"]]];
const temas = () => [...new Set([...BASE_TEMAS, ...[...S.items.values()].map(t => t.tema).filter(Boolean)])];
const detectarTema = texto => { const t = llano(texto); const r = CLAVES_TEMA.find(([, cs]) => cs.some(c => t.includes(c))); return r ? r[0] : null; };
const nombreTema = v => { const x = (v || "").trim(); if (!x) return null; return temas().find(m => llano(m) === llano(x)) || x.charAt(0).toUpperCase() + x.slice(1); };
const nombreMunicipio = v => { const x = (v || "").trim(); if (!x) return null; return municipios().find(m => llano(m) === llano(x)) || x.charAt(0).toUpperCase() + x.slice(1); };

const corto = s => fmtCorto.format(aFecha(s)).replace(/\./g, "").replace(",", "");

function semana(s) {
  const d = aFecha(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const e = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - e) / 864e5 - 3 + ((e.getDay() + 6) % 7)) / 7);
}

/* Festivos de Colombia: fijos, trasladados al lunes (Ley Emiliani) y ligados a la Pascua. */
const cacheFestivos = {};
function festivos(y) {
  if (cacheFestivos[y]) return cacheFestivos[y];
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  const pascua = iso(new Date(y, mes - 1, dia));
  const lunes = s => { const x = aFecha(s); while (x.getDay() !== 1) x.setDate(x.getDate() + 1); return iso(x); };
  const r = {};
  [["01-01", "Año Nuevo"], ["05-01", "Día del Trabajo"], ["07-20", "Independencia de Colombia"], ["08-07", "Batalla de Boyacá"],
   ["12-08", "Inmaculada Concepción"], ["12-25", "Navidad"]].forEach(([f, n]) => r[`${y}-${f}`] = n);
  [["01-06", "Reyes Magos"], ["03-19", "San José"], ["06-29", "San Pedro y San Pablo"], ["08-15", "Asunción de la Virgen"],
   ["10-12", "Día de la Raza"], ["11-01", "Todos los Santos"], ["11-11", "Independencia de Cartagena"]]
    .forEach(([f, n]) => r[lunes(`${y}-${f}`)] = n);
  [[-3, "Jueves Santo"], [-2, "Viernes Santo"], [43, "Ascensión del Señor"], [64, "Corpus Christi"], [71, "Sagrado Corazón"]]
    .forEach(([n, t]) => r[sumar(pascua, n)] = t);
  return cacheFestivos[y] = r;
}
const festivo = s => festivos(+s.slice(0, 4))[s] || "";

/* Estado */
const S = { dia: hoyIso(), mes: hoyIso().slice(0, 7), vista: "dia", items: new Map(), notas: new Map(), abiertos: new Set(), cargando: true, recien: null };
let db = null;
try { S.area = localStorage.getItem("agenda-area") || ""; S.muni = localStorage.getItem("agenda-muni") || ""; S.tema = localStorage.getItem("agenda-tema") || ""; } catch (e) { S.area = ""; S.muni = ""; S.tema = ""; }

/* Guardado: una escritura a la vez por documento. */
const colas = {};
function encolar(k, fn) {
  colas[k] = (colas[k] || Promise.resolve()).then(fn).catch(() => {
    aviso("No pude guardar el último cambio. Revisa tu conexión e inténtalo de nuevo.");
  });
}
const LS = "agenda-daniela";
function guardarLocal() {
  try { localStorage.setItem(LS, JSON.stringify({ items: [...S.items], notas: [...S.notas] })); } catch (e) {}
}
function leerLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || "null");
    if (d) { S.items = new Map(d.items); S.notas = new Map(d.notas); }
  } catch (e) {}
}
function ponerItem(id, data) {
  S.items.set(id, data); render();
  if (db) encolar(id, () => db.collection("pendientes").doc(id).set(data)); else guardarLocal();
}
function cambiar(id, parcial) { const it = S.items.get(id); if (it) ponerItem(id, { ...it, ...parcial }); }
function quitarItem(id) {

  if (db) encolar(id, () => db.collection("pendientes").doc(id).delete()); else guardarLocal();
}
function ponerNota(fecha, texto) {
  const k = "nota-" + fecha;
  if (texto.trim()) S.notas.set(fecha, { texto }); else S.notas.delete(fecha);
  if (db) encolar(k, () => texto.trim() ? db.collection("notas").doc(fecha).set({ texto }) : db.collection("notas").doc(fecha).delete());
  else guardarLocal();
}

/* Avisos */
function aviso(t) { $("aviso").textContent = t; $("aviso").hidden = !t; }
let tToast;
function toast(texto, deshacer) {
  const el = $("toast"); el.textContent = texto;
  if (deshacer) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Deshacer";
    b.onclick = () => { deshacer(); el.hidden = true; }; el.append(b);
  }
  el.hidden = false; clearTimeout(tToast); tToast = setTimeout(() => el.hidden = true, deshacer ? 6000 : 2600);
}

/* Dibujo */
function h(tag, props = {}, ...hijos) {
  const e = document.createElement(tag);
  for (const k in props) { if (k in e) e[k] = props[k]; else e.setAttribute(k, props[k]); }
  e.append(...hijos.filter(x => x !== null && x !== undefined)); return e;
}
const ABANICO = ["#7c9cd8", "#e88fb4", "#b39ddb", "#c8a27a", "#8e7cc3", "#f4d35e", "#5fb8a8", "#f08a5d", "#6aa9e0", "#a3c55c", "#c47ab3", "#4f8a8b", "#ffb199", "#88c0d0", "#d4a5a5", "#9be4d1"];
const CAT_BASE = {
  "Cementerio Central": "#7c9cd8", "Protocolo de acceso": "#e88fb4", "Oficios y documentos": "#9aa5b1", "Convenios IDIPRON": "#b39ddb",
  "RenoBo (Contrato 581)": "#c8a27a", "Servicios funerarios": "#8e7cc3", "Alumbrado público": "#f4d35e",
  "Guaduas": "#5fb8a8", "Viotá": "#f08a5d", "La Calera": "#6aa9e0", "Bojacá": "#a3c55c", "Chocontá": "#c47ab3", "Fusagasugá": "#ffb199", "La Mesa": "#4f8a8b"
};
function colorDe(nombre) {
  const propio = (colores.cat || {})[nombre];
  if (propio) return propio;
  if (CAT_BASE[nombre]) return CAT_BASE[nombre];
  let n = 0; for (const ch of llano(nombre)) n = (n * 31 + ch.charCodeAt(0)) >>> 0;
  return ABANICO[n % ABANICO.length];
}
function etiquetaCat(nombre) {

}

}
const ordenEstado = { pendiente: 0, hecho: 1, tachado: 2 };
const ordenar = l => l.sort((a, b) => ordenEstado[a[1].estado] - ordenEstado[b[1].estado] || rangoPrio(a[1]) - rangoPrio(b[1]) || a[1].creado - b[1].creado);
const todos = () => [...S.items.entries()].filter(([, t]) => (!S.area || t.area === S.area) && (S.area !== "CAR" || !S.muni || t.municipio === S.muni) && (S.area !== "UAESP" || !S.tema || t.tema === S.tema));
const atrasados = () => ordenar(todos().filter(([, t]) => !esEv(t) && t.fecha && t.fecha < hoyIso() && t.estado === "pendiente"));

function fila(id, t, conFecha) {
  const ev = esEv(t);
  const li = h("li", { className: "task" + (ev ? " evento" : "") + (S.recien === id ? " recien" : "") });
  li.dataset.estado = t.estado;
  if (t.prioridad) li.dataset.prioridad = t.prioridad;
  const check = h("button", { className: "check", type: "button", title: "Chulear" });
  check.dataset.key = "c" + id;
  check.setAttribute("aria-label", t.estado === "hecho" ? "Quitar el chulo" : "Chulear");
  check.setAttribute("aria-pressed", t.estado === "hecho");

  check.onclick = () => { S.recien = t.estado === "hecho" ? null : id; cambiar(id, { estado: t.estado === "hecho" ? "pendiente" : "hecho", hechoEn: t.estado === "hecho" ? null : Date.now() }); };

  const texto = h("textarea", { className: "texto", rows: 1, value: t.texto, spellcheck: true });

  texto.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); texto.blur(); } };

  const abierto = S.abiertos.has(id);
  const partes = [];
  if (t.area && !S.area) partes.push(h("span", { className: "tag " + t.area.toLowerCase() }, t.area));
  if (!ev && PRIO[t.prioridad]) {
    const sig = { alta: "media", media: "baja", baja: null };
    const sem = h("button", { className: "sem " + t.prioridad, type: "button", textContent: PRIO[t.prioridad], title: "Cambiar prioridad" });
    sem.dataset.key = "s" + id;

  const meta = partes.length ? h("div", { className: "meta" }, ...partes) : null;
  const res = (t.nota && !abierto) ? h("p", { className: "resumen-nota" }, t.nota) : null;
  const cuerpo = h("div", { className: "cuerpo" }, texto, meta, res);

  const tachar = h("button", { className: "mini tachar", type: "button", textContent: ev ? (t.estado === "tachado" ? "Reactivar" : "Cancelar") : (t.estado === "tachado" ? "Destachar" : "Tachar") });

    const sin = h("button", { className: "mini", type: "button", textContent: "Sin fecha" });
    sin.onclick = () => { cambiar(id, { fecha: null }); toast("Quedó en Todos los pendientes, sin fecha"); };

function pintarContenido() {

    const delDia = todos().filter(([, t]) => t.fecha === S.dia);
    const eventos = delDia.filter(([, t]) => esEv(t)).sort((a, b) => (a[1].hora || "").localeCompare(b[1].hora || ""));
    const propios = ordenar(delDia.filter(([, t]) => !esEv(t)));

    if (eventos.length) c.append(bloque("Reuniones y eventos", eventos, false, "eventos"));

  const fallo = () => aviso("No pude guardar el último cambio. Revisa tu conexión e inténtalo de nuevo.");
  let parar = [];
  $("login").addEventListener("submit", async e => {
    e.preventDefault(); $("loginError").hidden = true;
    try { await A.signInWithEmailAndPassword(auth, $("correo").value.trim(), $("clave").value); $("clave").value = ""; }
    catch (err) { $("loginError").textContent = "No pude entrar. Revisa el correo y la contraseña."; $("loginError").hidden = false; }
  });
  $("salir").onclick = () => { guardarNotaYa(); A.signOut(auth); };
  A.onAuthStateChanged(auth, u => {
    parar.forEach(f => f()); parar = [];
    $("login").hidden = !!u; $("app").hidden = !u;
    S.items = new Map(); S.notas = new Map(); S.cargando = !!u; db = null;
    if (!u) return;
    /* Las escrituras se aplican de inmediato en el dispositivo y se envían cuando hay conexión. */
    const ref = (n, id) => F.doc(fsdb, "users", u.uid, n, id);
    db = { collection: n => ({ doc: id => ({
      set: d => { F.setDoc(ref(n, id), d).catch(fallo); return Promise.resolve(); },
      delete: () => { F.deleteDoc(ref(n, id)).catch(fallo); return Promise.resolve(); } }) }) };
    const espera = setTimeout(() => { if (S.cargando) aviso("Tu agenda está tardando en cargar. Revisa tu conexión."); }, 10000);
    const err = () => { clearTimeout(espera); S.cargando = false; aviso("No pude leer tu agenda. Vuelve a abrirla."); render(); };
    parar.push(F.onSnapshot(F.collection(fsdb, "users", u.uid, "pendientes"), snap => {
      S.items = new Map(snap.docs.map(d => [d.id, d.data()]));
      clearTimeout(espera); aviso(""); S.cargando = false; render();
    }, err));
    parar.push(F.onSnapshot(F.doc(fsdb, "users", u.uid, "ajustes", "colores"), d => {
      if (d.exists()) { aplicarColores(d.data()); try { localStorage.setItem("agenda-colores", JSON.stringify(colores)); } catch (e) {} }
    }, () => {}));
    parar.push(F.onSnapshot(F.collection(fsdb, "users", u.uid, "notas"), snap => {
      S.notas = new Map(snap.docs.map(d => [d.id, d.data()])); render();
    }, err));
    render();
  });
})().catch(() => { $("login").hidden = false; $("loginError").hidden = false; $("loginError").textContent = "No pude abrir la app. Revisa tu conexión."; });
</script>
